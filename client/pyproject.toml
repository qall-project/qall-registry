[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qall-registry-client"
version = "0.1.1"
description = "Qall Registry package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "dataclasses",
    "py-ipld-dag",
    "protobuf>=7.35.1",
    "google-api-python-client",
]

[tool.setuptools_scm]

[project.urls]
Repository = "https://github.com/qall/qall-registry-client"
